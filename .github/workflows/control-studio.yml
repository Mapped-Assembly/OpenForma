name: Control Studio and firmware SIL

on:
  pull_request:
    paths:
      - 'forma_core/control/**'
      - 'forma_core/firmware/sil/**'
      - 'examples/control_studio/**'
      - 'examples/rover_kitchen/**'
      - 'tests/control/**'
      - 'forma_core/spatial/**'
      - 'tests/spatial/**'
      - 'tests/firmware/test_sil.py'
      - 'pyproject.toml'
      - '.github/workflows/control-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-and-native-firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/control_studio/package-lock.json
      - name: Install optional control host and test dependencies
        run: python -m pip install -e ".[control,robot-sim]" httpx
      - name: Build native firmware (required, not skipped)
        run: python -m forma_core.firmware.sil.build --output examples/control_studio/generated/firmware
      - name: Test control runtime, native firmware and service
        run: python -m unittest tests.control.test_runtime tests.control.test_client tests.control.test_service tests.control.test_package tests.control.test_tasks tests.firmware.test_sil -v
      - name: Test device-neutral spatial frame graph
        run: python -m unittest discover -s tests/spatial -v
      - name: Verify portable two-rover workcell
        if: runner.os == 'Linux'
        run: |
          python -m forma_core.control.rover_scene.assets examples/rover_kitchen/generated/robots
          python -m unittest -v examples.rover_kitchen.test_workcell
      - name: Run ideal control benchmark
        run: python examples/control_studio/benchmark.py
      - name: Run compiled firmware benchmark
        run: python examples/control_studio/firmware_benchmark.py
      - name: Prepare pinned SO-101 model (explicit download)
        run: python examples/control_studio/setup_so101.py
      - name: Test contact physics and task transport
        run: python -m unittest tests.control.test_so101 -v
      - name: Require contact-only SO-101 benchmark success
        run: python examples/control_studio/so101_benchmark.py
      - name: Require declared-action completion evidence
        run: python examples/control_studio/action_benchmark.py
      - name: Install frontend dependencies
        working-directory: examples/control_studio
        run: npm ci
      - name: Test input adapters
        working-directory: examples/control_studio
        run: npm test
      - name: Build standalone studio frontend
        working-directory: examples/control_studio
        run: npm run build
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: control-studio-benchmarks-${{ matrix.os }}
          if-no-files-found: error
          path: |
            examples/control_studio/generated/control-benchmark.json
            examples/control_studio/generated/firmware-benchmark.json
            examples/control_studio/generated/firmware/build-manifest.json
            examples/control_studio/generated/so101-benchmark.json
            examples/control_studio/generated/so101/source-manifest.json
            examples/control_studio/generated/action-evidence.json
