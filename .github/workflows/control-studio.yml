name: Control Studio and firmware SIL

on:
  pull_request:
    paths:
      - 'forma_core/control/**'
      - 'forma_core/firmware/sil/**'
      - 'examples/control_studio/**'
      - 'tests/control/**'
      - 'tests/firmware/test_sil.py'
      - 'pyproject.toml'
      - '.github/workflows/control-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  control-and-native-firmware:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/control_studio/package-lock.json
      - name: Install optional control host and test dependencies
        run: python -m pip install -e ".[control]" httpx
      - name: Build native firmware (required, not skipped)
        run: python -m forma_core.firmware.sil.build --output examples/control_studio/generated/firmware
      - name: Test control runtime, native firmware and service
        run: python -m unittest tests.control.test_runtime tests.control.test_service tests.firmware.test_sil -v
      - name: Run ideal control benchmark
        run: python examples/control_studio/benchmark.py
      - name: Run compiled firmware benchmark
        run: python examples/control_studio/firmware_benchmark.py
      - name: Install frontend dependencies
        working-directory: examples/control_studio
        run: npm ci
      - name: Test input adapters
        working-directory: examples/control_studio
        run: npm test
      - name: Build standalone studio frontend
        working-directory: examples/control_studio
        run: npm run build
      - name: Upload benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: control-studio-benchmarks-${{ matrix.os }}
          if-no-files-found: error
          path: |
            examples/control_studio/generated/control-benchmark.json
            examples/control_studio/generated/firmware-benchmark.json
            examples/control_studio/generated/firmware/build-manifest.json
