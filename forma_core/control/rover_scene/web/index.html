<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Forma · Rover workcell</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f6ef;color:#1b342f;font:15px/1.45 "Inter",system-ui,sans-serif}
header{padding:22px 4vw;border-bottom:1px solid #cbd1c5;display:flex;align-items:center;justify-content:space-between}
header strong{font-size:17px}header span,.minor{color:#51695d;font-size:13px}main{max-width:1500px;margin:auto;padding:26px 4vw}
h1{font:500 clamp(29px,3.5vw,48px)/1.1 Georgia,serif;margin:0 0 22px}h2{font-size:18px;margin:0 0 14px}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(265px,330px);gap:24px}
#view{position:relative;overflow:hidden;height:clamp(330px,58vh,650px);border-radius:12px;background:#e4e8df;border:1px solid #cbd1c5}
canvas{width:100%;height:100%;display:block}.label{position:absolute;background:#fcfcf4e8;color:#23392f;font-weight:600;font-size:11px;padding:3px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;transform:translate(-50%,-100%)}.panel{background:#fffef8;padding:20px;border-radius:12px;border:1px solid #ced4c7}
label{display:block;margin:13px 0 5px;font-weight:600}textarea,select,input{font:inherit;width:100%;padding:10px;border:1px solid #a6b6aa;border-radius:6px;background:white;color:inherit}textarea{resize:vertical;min-height:90px}
button{padding:9px 15px;font:inherit;font-weight:600;border:1px solid #91a395;border-radius:6px;background:transparent;color:inherit;cursor:pointer}button[type=submit]{background:#264d3f;color:white;border-color:#264d3f}button:disabled{opacity:.5;cursor:default}.actions{display:flex;gap:8px;margin:12px 0}
#status{overflow-wrap:anywhere}.inventory{margin-top:24px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-top:1px solid #d7dacf;padding:9px 4px}th{font-size:12px;color:#52695c}
#events{padding-left:20px;max-height:150px;overflow:auto;font-size:13px}a{color:#245642}#error{color:#8e352a}
@media(max-width:800px){.layout{grid-template-columns:1fr}#view{height:45vh}.label{font-size:9px}}
</style><script type="importmap">{"imports":{"three":"/three.js"}}</script></head>
<body><header><strong>Forma / Workcells</strong><span>MuJoCo simulation</span></header><main><h1 id="title">Rover workcell</h1>
<div class="layout"><section><div id="view" aria-label="3D workcell with live rover positions"></div><p class="minor">Drag to orbit · Scroll to zoom</p></section>
<section class="panel"><h2>Task control</h2><form id="task"><label for="machine">Machine</label><select id="machine"></select>
<label for="goal">Goal</label><textarea id="goal" placeholder="Describe the task for this rover" required maxlength="2000"></textarea>
<details style="margin-top:8px"><summary class="minor">Model settings</summary><label for="model">Provider/model</label><input id="model" placeholder="OpenCode default"></details><div class="actions"><button type="submit" id="start" disabled>Run task</button><button type="button" id="stop" disabled>Stop</button></div></form>
<div id="status" aria-live="polite">Connecting…</div><p id="error" role="alert"></p><ol id="events"></ol><a id="journal" hidden>Execution journal</a></section></div>
<section class="inventory"><h2>Shared inventory</h2><table><thead><tr><th>Item</th><th>Location</th><th>Held by</th></tr></thead><tbody id="stock"></tbody></table></section></main>
<script type="module" src="/viewer.js"></script></body></html>
